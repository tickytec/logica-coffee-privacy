<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support — Logica Coffee</title>
  <style>
    :root {
      --bg:      #100f0d;
      --surface: #1a1613;
      --orange:  #d68757;
      --white:   #f4f1ea;
      --gray:    #8a8076;
      --border:  #2c2722;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      padding: 0 16px 80px;
    }
    .wrap { max-width: 680px; margin: 0 auto; }
    header {
      padding: 56px 0 40px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 48px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }
    .app-label {
      font-family: "SF Mono", "Fira Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--orange);
      text-transform: uppercase;
    }
    .lang-switch {
      position: relative;
      flex-shrink: 0;
    }
    .lang-switch select {
      appearance: none;
      -webkit-appearance: none;
      background: var(--surface);
      color: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 30px 7px 12px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.02em;
    }
    .lang-switch::after {
      content: "";
      position: absolute;
      right: 12px;
      top: 50%;
      width: 7px;
      height: 7px;
      border-right: 1.5px solid var(--gray);
      border-bottom: 1.5px solid var(--gray);
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
    }
    .lang-switch select:focus { outline: none; border-color: var(--orange); }
    h1 {
      font-family: "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 6.5vw, 56px);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.08;
      color: var(--white);
    }
    .updated {
      margin-top: 16px;
      font-size: 13px;
      color: var(--gray);
      font-family: "SF Mono", "Fira Mono", monospace;
      letter-spacing: 0.05em;
    }
    section { margin-bottom: 48px; }
    h2 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--orange);
      font-family: "SF Mono", "Fira Mono", monospace;
      margin-bottom: 16px;
    }
    p { color: #ccc; margin-bottom: 14px; }
    p:last-child { margin-bottom: 0; }
    ul { list-style: none; padding: 0; }
    ul li {
      color: #ccc;
      padding: 10px 0 10px 20px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    ul li:first-child { border-top: 1px solid var(--border); }
    ul li::before {
      content: "—";
      position: absolute;
      left: 0;
      color: var(--orange);
      font-weight: 700;
    }
    .highlight-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--orange);
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 32px;
    }
    .highlight-box p { color: var(--white); font-size: 15px; margin: 0; }
    .faq-item { border-bottom: 1px solid var(--border); padding: 20px 0; }
    .faq-item:first-of-type { border-top: 1px solid var(--border); }
    .faq-q { color: var(--white); font-weight: 600; margin-bottom: 8px; }
    .faq-a { color: #ccc; margin: 0; }
    .faq-a strong { color: var(--white); }
    a { color: var(--orange); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .contact-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .contact-card .label {
      font-family: "SF Mono", "Fira Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray);
    }
    .contact-card .email { font-size: 17px; font-weight: 600; color: var(--orange); }
    .contact-card .note { font-size: 13px; color: var(--gray); margin-top: 4px; }
    footer {
      border-top: 1px solid var(--border);
      padding-top: 32px;
      font-size: 13px;
      color: var(--gray);
      font-family: "SF Mono", "Fira Mono", monospace;
    }
    footer a { color: var(--gray); }
    footer a:hover { color: var(--orange); text-decoration: underline; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="topbar">
        <p class="app-label">Logica Coffee</p>
        <div class="lang-switch">
          <label id="langLabel" for="lang" style="display:none"></label>
          <select id="lang" aria-label="Language">
          <option value="en" selected>English</option>
          <option value="be">Беларуская</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="it">Italiano</option>
          <option value="ja">日本語</option>
          <option value="pl">Polski</option>
          <option value="pt-BR">Português (BR)</option>
          <option value="ru">Русский</option>
          <option value="uk">Українська</option>
          <option value="zh-Hans">中文</option>
          </select>
        </div>
      </div>
      <h1 id="title">Support</h1>
      <p class="updated" id="updated"></p>
    </header>

    <div id="content"></div>

    <footer><p id="footer"></p></footer>
  </div>
  <script>
  var LANGS = [["en", "English"], ["be", "Беларуская"], ["de", "Deutsch"], ["es", "Español"], ["fr", "Français"], ["it", "Italiano"], ["ja", "日本語"], ["pl", "Polski"], ["pt-BR", "Português (BR)"], ["ru", "Русский"], ["uk", "Українська"], ["zh-Hans", "中文"]];
  var STR = {"en": {"title": "Support", "updated": "We typically respond within 24 hours", "blocks": [["highlight", "Have a question, found a bug, or want to suggest something? Drop an email — every message is read personally."], ["contact", "Email", "Include your iPhone model and iOS version if reporting a bug."], ["h2", "Frequently Asked Questions"], ["faq", "Is Logica Coffee free?", "Yes, completely. No subscription, no paywall, no ads. Every feature is fully unlocked from the moment you install. Optional tips are available inside if you'd like to support development — entirely your choice."], ["faq", "Where is my data stored?", "All your brew journal entries, bean inventory, and custom recipes are stored on your device. If you have iCloud enabled, they sync automatically across your devices via your personal iCloud account. Nothing is sent to any external server."], ["faq", "How do I back up or transfer my data to a new iPhone?", "If iCloud sync is enabled, your data transfers automatically when you sign in on a new device. Alternatively, restoring from an iCloud or iTunes backup will include all Logica Coffee data."], ["faq", "The Apple Watch app isn't syncing with my iPhone. What do I do?", "Make sure both devices are on the same Apple ID and that Bluetooth is enabled. Open the app on your iPhone first, then launch it on your Watch. If the problem persists, force-quitting and reopening both apps usually resolves it."], ["faq", "How do I create a custom recipe?", "In the Brew Builder, select a method, then tap the recipe selector and choose &ldquo;Create Recipe&rdquo;. You can add as many stages as you like, setting pour amount, timing, and water type for each one."], ["faq", "How do I share a recipe with a friend?", "Open the recipe selector in the Brew Builder, tap the menu on any custom recipe you've created, and choose &ldquo;Share Recipe&rdquo;. You'll get a QR code and a link you can send through Messages, Mail, or anywhere else. Your friend taps the link (or scans the code) to open it in Logica Coffee, where they can preview the recipe and add it to their own library. Only custom recipes can be shared — and a recipe is never added automatically, so you always confirm before anything is saved."], ["faq", "What brew methods does the app support?", "Hario V60, AeroPress, Chemex, French Press, Hario Switch, Clever Dripper, Moka Pot, Syphon, Cold Brew, Turkish Coffee, Vietnamese Phin, Ceado Hoop, Espresso, Ristretto, Lungo, Americano, Cappuccino, Flat White, Latte, Cortado, Macchiato, and Singapore Kopi."], ["faq", "How does the coffee bag scanner work?", "When adding new beans, tap the scan icon and take a photo of your coffee bag. The app uses on-device AI to automatically read and fill in details like the roaster, origin, process, and tasting notes."], ["faq", "How do the guided Dial-in sessions work?", "Dial-in isn't just for espresso — it works with any method. Start a session and the app walks you through a closed loop: brew, tell it how the cup tasted (too sour, too bitter, weak, balanced), and it suggests a single concrete adjustment to grind, dose, or ratio for the next attempt. It records every step so you can see exactly how you converged on your perfect recipe, and you can pick a session back up later right where you left off."], ["faq", "What is the Coach (James)?", "James is your built-in coffee coach. Tell him what you brewed and how it tasted and he'll explain what's happening in the cup and what to change next — grind, temperature, ratio, or technique. He runs entirely on your device: there's no account, no internet connection required, and nothing you tell him ever leaves your iPhone."], ["faq", "Can Logica Coffee log my caffeine to Apple Health?", "Yes. In <strong>Settings → Apple Health</strong>, turn on caffeine logging and grant permission. From then on, each brew you save writes an estimated caffeine amount to Apple Health, so it shows up alongside the rest of your health data. The app only ever writes this value — it never reads any of your health data — and you can turn it off or revoke access at any time in the Health app."], ["faq", "How do I delete all my data?", "You can delete individual journal entries and beans from within the app. To remove all data, uninstall the app. If iCloud sync is enabled, you can also remove Logica Coffee data from <strong>Settings → [Your Name] → iCloud → Manage Account Storage</strong>."], ["faq", "I found a bug. How do I report it?", "Email us at <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a> with a description of what happened, your iPhone model, and your iOS version. Screenshots are always helpful."], ["h2", "Privacy"], ["p", "Logica Coffee does not collect, transmit, or share any personal data. Read the full <a href=\"./index.html\">Privacy Policy</a>."]]}, "be": {"title": "Support", "updated": "We typically respond within 24 hours", "blocks": [["highlight", "Have a question, found a bug, or want to suggest something? Drop an email — every message is read personally."], ["contact", "Email", "Include your iPhone model and iOS version if reporting a bug."], ["h2", "Frequently Asked Questions"], ["faq", "Is Logica Coffee free?", "Yes, completely. No subscription, no paywall, no ads. Every feature is fully unlocked from the moment you install. Optional tips are available inside if you'd like to support development — entirely your choice."], ["faq", "Where is my data stored?", "All your brew journal entries, bean inventory, and custom recipes are stored on your device. If you have iCloud enabled, they sync automatically across your devices via your personal iCloud account. Nothing is sent to any external server."], ["faq", "How do I back up or transfer my data to a new iPhone?", "If iCloud sync is enabled, your data transfers automatically when you sign in on a new device. Alternatively, restoring from an iCloud or iTunes backup will include all Logica Coffee data."], ["faq", "The Apple Watch app i ag. The app uses on-device AI to automatically read and fill in details like the roaster, origin, process, and tasting notes."], ["faq", "How do the guided Dial-in sessions work?", "Dial-in isn't just for espresso — it works with any method. Start a session and the app walks you through a closed loop: brew, tell it how the cup tasted (too sour, too bitter, weak, balanced), and it suggests a single concrete adjustment to grind, dose, or ratio for the next attempt. It records every step so you can see exactly how you converged on your perfect recipe, and you can pick a session back up later right where you left off."], ["faq", "What is the Coach (James)?", "James is your built-in coffee coach. Tell him what you brewed and how it tasted and he'll explain what's happening in the cup and what to change next — grind, temperature, ratio, or technique. He runs entirely on your device: there's no account, no internet connection required, and nothing you tell him ever leaves your iPhone."], ["faq", "Can Logica Coffee log my caffeine to Apple Health?", "Yes. In <strong>Settings → Apple Health</strong>, turn on caffeine logging and grant permission. From then on, each brew you save writes an estimated caffeine amount to Apple Health, so it shows up alongside the rest of your health data. The app only ever writes this value — it never reads any of your health data — and you can turn it off or revoke access at any time in the Health app."], ["faq", "How do I delete all my data?", "You can delete individual journal entries and beans from within the app. To remove all data, uninstall the app. If iCloud sync is enabled, you can also remove Logica Coffee data from <strong>Settings → [Your Name] → iCloud → Manage Account Storage</strong>."], ["faq", "I found a bug. How do I report it?", "Email us at <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a> with a description of what happened, your iPhone model, and your iOS version. Screenshots are always helpful."], [" ", "How do I share a recipe with a friend?", "Open the recipe selector in the Brew Builder, tap the menu on any custom recipe you've created, and choose &ldquo;Share Recipe&rdquo;. You'll get a QR code and a link you can send through Messages, Mail, or anywhere else. Your friend taps the link (or scans the code) to open it in Logica Coffee, where they can preview the recipe and add it to their own library. Only custom recipes can be shared — and a recipe is never added automatically, so you always confirm before anything is saved."], ["faq", "What brew methods does the app support?", "Hario V60, AeroPress, Chemex, French Press, Hario Switch, Clever Dripper, Moka Pot, Syphon, Cold Brew, Turkish Coffee, Vietnamese Phin, Ceado Hoop, Espresso, Ristretto, Lungo, Americano, Cappuccino, Flat White, Latte, Cortado, Macchiato, and Singapore Kopi."], ["faq", "How does the coffee bag scanner work?", "When adding new beans, tap the scan icon and take a photo of your coffee bag. The app uses on-device AI to automatically read and fill in details like the roaster, origin, process, and tasting notes."], ["faq", "How do the guided Dial-in sessions work?", "Dial-in isn't just for espresso — it works with any method. Start a session and the app walks you through a closed loop: brew, tell it how the cup tasted (too sour, too bitter, weak, balanced), and it suggests a single concrete adjustment to grind, dose, or ratio for the next attempt. It records every step so you can see exactly how you converged on your perfect recipe, and you can pick a session back up later right where you left off."], ["faq", "What is the Coach (James)?", "James is your built-in coffee coach. Tell him what you brewed and how it tasted and he'll explain what's happening in the cup and what to change next — grind, temperature, ratio, or technique. He runs entirely on your device: there's no account, no internet connection required, and nothing you tell him ever leaves your iPhone."], ["faq", "Can Logica Coffee   var UI  = {"en": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "be": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "de": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "es": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "fr": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "it": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "ja": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "pl": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "pt-BR": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "ru": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "uk": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "zh-Hans": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}};
  var KIND = "support"; // 'privacy' or 'support'

  function esc(){return arguments[0];}

  function pickLang() {
    var h = location.hash.replace('#','');
    if (STR[h]) return h;
    try { var s = localStorage.getItem('lc_lang'); if (s && STR[s]) return s; } catch(e){}
    var n = (navigator.language || navigator.userLanguage || 'en');
    if (STR[n]) return n;
    var base = n.toLowerCase().split('-')[0];
    if (base === 'pt') return STR['pt-BR'] ? 'pt-BR' : 'en';
    if (base === 'zh') return STR['zh-Hans'] ? 'zh-Hans' : 'en';
    for (var i=0;i<LANGS.length;i++){ if (LANGS[i][0].toLowerCase().split('-')[0] === base && STR[LANGS[i][0]]) return LANGS[i][0]; }
    return 'en';
  }

  function renderBlocks(blocks, ui) {
    var html = '';
    var open = false;
    function openSec(){ if(!open){ html += '<section>'; open = true; } }
    function closeSec(){ if(open){ html += '</section>'; open = false; } }
    for (var i=0;i<blocks.length;i++) {
      var b = blocks[i];
      var t = b[0];
      if (t === 'highlight') {
        closeSec();
        html += '<section><div class="highlight-box"><p>' + b[1] + '</p></div></section>';
      } else if (t === 'h2') {
        closeSec(); openSec();
        html += '<h2>' + b[1] + '</h2>';
      } else if (t === 'p') {
        openSec();
        html += '<p>' + b[1] + '</p>';
      } else if (t === 'ul') {
        openSec();
        html += '<ul>';
        for (var j=0;j<b[1].length;j++) html += '<li>' + b[1][j] + '</li>';
        html += '</ul>';
      } else if (t === 'faq') {
        openSec();
        html += '<div class="faq-item"><p class="faq-q">' + b[1] + '</p><p class="faq-a">' + b[2] + '</p></div>';
      } else if (t === 'contact') {
        closeSec();
        html += '<section><div class="contact-card"><span class="label">' + b[1] +
                '</span><a class="email" href="mailto:khatskevich.mv@gmail.com">khatskevich.mv@gmail.com</a><span class="note">' +
                b[2] + '</span></div></section>';
      }
    }
    closeSec();
    return html;
  }

  function apply(loc) {
    var d = STR[loc] || STR['en'];
    var ui = UI[loc] || UI['en'];
    document.documentElement.lang = loc;
    document.title = d.title + ' — Logica Coffee';
    document.getElementById('title').textContent = d.title;
    document.getElementById('updated').textContent = d.updated;
    document.getElementById('langLabel').textContent = '';
    document.getElementById('content').innerHTML = renderBlocks(d.blocks, ui);
    var foot = document.getElementById('footer');
    if (foot) {
      foot.innerHTML = 'Logica Coffee &mdash; Mikita Khatskevich &mdash; 2026' +
        (KIND === 'support' ? ' &mdash; <a href="./index.html">' + ui.footerPrivacy + '</a>' : '');
    }
    document.getElementById('lang').value = loc;
    try { localStorage.setItem('lc_lang', loc); } catch(e){}
  }

  var sel = document.getElementById('lang');
  sel.addEventListener('change', function(){ location.hash = this.value; apply(this.value); });
  window.addEventListener('hashchange', function(){ var h = location.hash.replace('#',''); if (STR[h]) apply(h); });
  apply(pickLang());
</script>
