<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policy — Logica Coffee</title>
  <style>
    :root {
      --bg:      #100f0d;
      --surface: #1a1613;
      --orange:  #d68757;
      --white:   #f4f1ea;
      --gray:    #8a8076;
      --border:  #2c2722;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      padding: 0 16px 80px;
    }
    .wrap { max-width: 680px; margin: 0 auto; }
    header {
      padding: 56px 0 40px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 48px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }
    .app-label {
      font-family: "SF Mono", "Fira Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--orange);
      text-transform: uppercase;
    }
    .lang-switch {
      position: relative;
      flex-shrink: 0;
    }
    .lang-switch select {
      appearance: none;
      -webkit-appearance: none;
      background: var(--surface);
      color: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 30px 7px 12px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.02em;
    }
    .lang-switch::after {
      content: "";
      position: absolute;
      right: 12px;
      top: 50%;
      width: 7px;
      height: 7px;
      border-right: 1.5px solid var(--gray);
      border-bottom: 1.5px solid var(--gray);
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
    }
    .lang-switch select:focus { outline: none; border-color: var(--orange); }
    h1 {
      font-family: "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 6.5vw, 56px);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.08;
      color: var(--white);
    }
    .updated {
      margin-top: 16px;
      font-size: 13px;
      color: var(--gray);
      font-family: "SF Mono", "Fira Mono", monospace;
      letter-spacing: 0.05em;
    }
    section { margin-bottom: 48px; }
    h2 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--orange);
      font-family: "SF Mono", "Fira Mono", monospace;
      margin-bottom: 16px;
    }
    p { color: #ccc; margin-bottom: 14px; }
    p:last-child { margin-bottom: 0; }
    ul { list-style: none; padding: 0; }
    ul li {
      color: #ccc;
      padding: 10px 0 10px 20px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    ul li:first-child { border-top: 1px solid var(--border); }
    ul li::before {
      content: "—";
      position: absolute;
      left: 0;
      color: var(--orange);
      font-weight: 700;
    }
    .highlight-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--orange);
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 32px;
    }
    .highlight-box p { color: var(--white); font-size: 15px; margin: 0; }
    .faq-item { border-bottom: 1px solid var(--border); padding: 20px 0; }
    .faq-item:first-of-type { border-top: 1px solid var(--border); }
    .faq-q { color: var(--white); font-weight: 600; margin-bottom: 8px; }
    .faq-a { color: #ccc; margin: 0; }
    .faq-a strong { color: var(--white); }
    a { color: var(--orange); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .contact-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .contact-card .label {
      font-family: "SF Mono", "Fira Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray);
    }
    .contact-card .email { font-size: 17px; font-weight: 600; color: var(--orange); }
    .contact-card .note { font-size: 13px; color: var(--gray); margin-top: 4px; }
    footer {
      border-top: 1px solid var(--border);
      padding-top: 32px;
      font-size: 13px;
      color: var(--gray);
      font-family: "SF Mono", "Fira Mono", monospace;
    }
    footer a { color: var(--gray); }
    footer a:hover { color: var(--orange); text-decoration: underline; }
</style>
</head>

  <script>
  var LANGS = [["en", "English"], ["be", "Беларуская"], ["de", "Deutsch"], ["es", "Español"], ["fr", "Français"], ["it", "Italiano"], ["ja", "日本語"], ["pl", "Polski"], ["pt-BR", "Português (BR)"], ["ru", "Русский"], ["uk", "Українська"], ["zh-Hans", "中文"]];
  var STR = {"en": {"title": "Privacy Policy", "updated": "Last updated: June 16, 2026 — Apple Health caffeine logging added", "blocks": [["highlight", "Logica Coffee does not collect, transmit, or share any personal data. Your data stays under your control — on your device and, if you choose, in your own iCloud account."], ["h2", "Overview"], ["p", "Logica Coffee is a personal coffee brewing companion. Your brew journal, bean inventory, recipes, and settings are stored on your device and — if you have iCloud enabled — synced across your devices via your personal iCloud account. We do not operate any servers, and no data is ever sent to us. No account is required."], ["h2", "Data stored on your device"], ["p", "The following information is saved on your device and, if iCloud is enabled, in your personal iCloud account:"], ["ul", ["Brew journal entries (method, dose, ratio, tasting notes, star rating)", "Coffee bean inventory (name, origin, roast level, flavour notes, remaining weight)", "Custom recipes and brew timelines you create", "Photos of your coffee bags that you choose to take or import", "App preferences and settings (grinder, temperature, filter type)"]], ["p", "This data is not accessible to us or any third party. You can delete it at any time from within the app or by uninstalling the app. You can disable iCloud sync for Logica Coffee at any time in <strong>Settings → [Your Name] → iCloud</strong> on your iPhone."], ["h2", "Camera &amp; photos"], ["p", "Logica Coffee can take a photo of a coffee bag to save with a bean, and can scan a bag's label to auto-fill bean details such as name, origin, and roast date. Reading the label is done entirely on your device using Apple's on-device text recognition — the image is never uploaded to us or any server, and the scanning happens offline."], ["p", "The camera is used only when you tap to take a photo, and only after you grant camera permission. If you instead choose a photo from your library, the app uses Apple's system photo picker, which hands over only the single image you select — Logica Coffee never gets access to the rest of your photo library. Any bag photos you save are stored on your device and, if iCloud is enabled, in your personal iCloud account, exactly like the rest of your data. You can remove a photo at any time from the bean's edit screen."], ["h2", "Notifications"], ["p", "If you add a roast date to a bean, Logica Coffee can schedule a local notification to remind you when those beans reach their peak freshness window. These reminders are scheduled and delivered entirely on your device — no information is sent anywhere, and notifications are only used after you grant permission. You can turn them off at any time in <strong>Settings → Notifications → Logica Coffee</strong>."], ["h2", "iCloud sync"], ["p", "If you have iCloud enabled on your device, Logica Coffee uses Apple's iCloud Documents service to sync your journal, bean inventory, and recipes across your iPhone and any other devices signed into the same Apple ID. This sync happens through your personal iCloud account — the data is stored by Apple under <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Apple's Privacy Policy</a> and is not accessible to us in any way."], ["p", "iCloud sync is entirely optional and controlled by your device settings. If iCloud is unavailable or disabled, the app stores your data locally on-device as normal."], ["h2", "Apple Watch sync"], ["p", "If you use the Logica Coffee Apple Watch app, brew session data is shared between your iPhone and Apple Watch using Apple's WatchConnectivity framework. This communication happens directly between your two devices over your local network or Bluetooth — it does not pass through any external server."], ["h2", "Apple Health"], ["p", "Logica Coffee can write an estimated caffeine amount for each brew you save to Apple Health, so your caffeine intake appears alongside the rest of your health data. This is entirely optional and off until you turn it on and grant permission in <strong>Settings → Apple Health</strong> inside the app."], ["p", "The app only ever <em>writes</em> caffeine entries — it never reads any of your health data. Apple requires the read permission prompt to enable caffeine logging at all, but Logica Coffee requests no read access and queries nothing from Health. All caffeine values are calculated on your device from the brew you logged, and the data is stored by Apple in Health under <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Apple's Privacy Policy</a> — it is never sent to us. You can revoke access at any time in <strong>Settings → Health → Data Access &amp; Devices → Logica Coffee</strong>."], ["h2", "Recipe sharing"], ["p", "Logica Coffee lets you share a custom recipe with someone else as a link or a QR code. This is always optional and only happens when you tap Share. The entire recipe — its name, author, and brewing steps — is encoded directly into the link itself; nothing is uploaded to or stored on a server by us, and the QR code is generated on your device."], ["p", "Where the link goes is your choice: it is handed to Apple's standard share sheet, so you decide whether to send it via Messages, Mail, or anywhere else. When someone opens a shared link, it first loads a small static redirect page (hosted on GitHub Pages) that simply bounces the link into the Logica Coffee app. As with any web page, GitHub's hosting may record routine request logs; no recipe data is collected, stored, or used by us. Recipes you receive are never added automatically — you always see a preview and confirm before anything is saved to your library."], ["h2", "Data we do not collect"], ["ul", ["We do not collect your name, email address, or any account information", "We do not track your location", "We do not read your Apple Health data — caffeine logging is write-only", "We do not collect analytics, crash reports, or usage statistics", "We do not use advertising SDKs or track you across apps", "We do not share any data with third parties"]], ["h2", "Third-party services"], ["p", "Logica Coffee does not integrate any third-party analytics, advertising, or crash reporting services. The only external frameworks used are Apple's own system frameworks (WatchConnectivity, WidgetKit, ActivityKit, iCloud Documents, HealthKit, the Vision on-device text recognition framework, the system photo picker, and local notifications), all of which operate under <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Apple's Privacy Policy</a>."], ["h2", "Children's privacy"], ["p", "Logica Coffee does not knowingly collect any data from users of any age. The app is suitable for all ages."], ["h2", "Changes to this policy"], ["p", "If this policy changes in a meaningful way (for example, if a future version of the app introduces network features), the updated date at the top of this page will reflect that, and the new policy will be available before the update reaches the App Store."], ["h2", "Contact"], ["p", "Questions about this privacy policy? Reach out at <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a>."]]}, "be": {"title": "Privacy Policy", "updated": "Last updated: June 16, 2026 — Apple Health caffeine logging added", "blocks": [["highlight", "Logica Coffee does not collect, transmit, or share any personal data. Your data stays under your control — on your device and, if you choose, in your own iCloud account."], ["h2", "Overview"], ["p", "Logica Coffee is a personal coffee brewing companion. Your brew journal, bean inventory, recipes, and settings are stored on your device and — if you have iCloud enabled — synced across your devices via your personal iCloud account. We do not operate any servers, and no data is ever sent to us. No account is required."], ["h2", "Data stored on your device"], ["p", "The following information is saved on your device and, if iCloud is enabled, in your pers ly between your two devices over your local network or Bluetooth — it does not pass through any external server."], ["h2", "Apple Health"], ["p", "Logica Coffee can write an estimated caffeine amount for each brew you save to Apple Health, so your caffeine intake appears alongside the rest of your health data. This is entirely optional and off until you turn it on and grant permission in <strong>Settings → Apple Health</strong> inside the app."], ["p", "The app only ever <em>writes</em> caffeine entries — it never reads any of your health data. Apple requires the read permission prompt to enable caffeine logging at all, but Logica Coffee requests no read access and queries nothing from Health. All caffeine values are calculated on your device from the brew you logged, and the data is stored by Apple in Health under <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Apple's Privacy Policy</a> — it is never sent to us. You can revoke access at any time in <strong>Settings → Health → Data Access &amp; Devices → Logica Coffee</strong>."], ["h2", "Recipe sharing"], ["p", "Logica Coffee lets you share a custom recipe with someone else as a link or a QR code. This is always optional and only happens when you tap Share. The entire recipe — its name, author, and brewing steps — is encoded directly into the link itself; nothing is uploaded to or stored on a server by us, and the QR code is generated on your device."], ["p", "Where the link goes is your choice: it is handed to Apple's standard share sheet, so you decide whether to send it via Messages, Mail, or anywhere else. When someone opens a shared link, it first loads a small static redirect page (hosted on GitHub Pages) that simply bounces the link into the Logica Coffee app. As with any web page, GitHub's hosting may record routine request logs; no recipe data is collected, stored, or used by us. Recipes you receive are never added automatically — you always see a preview and confirm before anything is  you tap Share. The entire recipe — its name, author, and brewing steps — is encoded directly into the link itself; nothing is uploaded to or stored on a server by us, and the QR code is generated on your device."], ["p", "Where the link goes is your choice: it is handed to Apple's standard share sheet, so you decide whether to send it via Messages, Mail, or anywhere else. When someone opens a shared link, it first loads a small static redirect page (hosted on GitHub Pages) that simply bounces the link into the Logica Coffee app. As with any web page, GitHub's hosting may record routine request logs; no recipe data is collected, stored, or used by us. Recipes you receive are never added automatically — you always see a preview and confirm before anything is saved to your library."], ["h2", "Data we do not collect"], ["ul", ["We do not collect your name, email address, or any account information", "We do not track your location", "We do not read your Apple Health data — caffeine logging is write-only", "We do not collect analytics, crash reports, or usage statistics", "We do not use advertising SDKs or track you across apps", "We do not share any data with third parties"]], ["h2", "Third-party services"], ["p", "Logica Coffee does not integrate any third-party analytics, advertising, or crash reporting services. The only external frameworks used are Apple's own system frameworks (WatchConnectivity, WidgetKit, ActivityKit, iCloud Documents, HealthKit, the Vision on-device text recognition framework, the system photo picker, and local notifications), all of which operate under <a href=\"https://www.apple.com/legal/privacy/\" target=\"_blank\">Apple's Privacy Policy</a>."], ["h2", "Children's privacy"], ["p", "Logica Coffee does not knowingly collect any data from users of any age. The app is suitable for all ages."], ["h2", "Changes to this policy"], ["p", "If this policy changes in a meaningful way (for example, if a future version of the app introduces network features), the updated date at the top of this page will reflect that, and the new policy will be available before the update reaches the App Store."], ["h2", "Contact"], ["p", "Questions about this privacy policy? Reach out at <a href=\"mailto:khatskevich.mv@gmail.com\">khatskevich.mv@gmail.com</a>."]]}};
  var UI  = {"en": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "be": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "de": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "es": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "fr": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "it": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "ja": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "pl": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "pt-BR": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "ru": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "uk": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}, "zh-Hans": {"langLabel": "Language", "contactEmail": "Email", "footerPrivacy": "Privacy Policy"}};
  var KIND = "privacy"; // 'privacy' or 'support'

  function esc(){return arguments[0];}

  function pickLang() {
    var h = location.hash.replace('#','');
    if (STR[h]) return h;
    try { var s = localStorage.getItem('lc_lang'); if (s && STR[s]) return s; } catch(e){}
    var n = (navigator.language || navigator.userLanguage || 'en');
    if (STR[n]) return n;
    var base = n.toLowerCase().split('-')[0];
    if (base === 'pt') return STR['pt-BR'] ? 'pt-BR' : 'en';
    if (base === 'zh') return STR['zh-Hans'] ? 'zh-Hans' : 'en';
    for (var i=0;i<LANGS.length;i++){ if (LANGS[i][0].toLowerCase().split('-')[0] === base && STR[LANGS[i][0]]) return LANGS[i][0]; }
    return 'en';
  }

  function renderBlocks(blocks, ui) {
    var html = '';
    var open = false;
    function openSec(){ if(!open){ html += '<section>'; open = true; } }
    function closeSec(){ if(open){ html += '</section>'; open = false; } }
    for (var i=0;i<blocks.length;i++) {
      var b = blocks[i];
      var t = b[0];
      if (t === 'highlight') {
        closeSec();
        html += '<section><div class="highlight-box"><p>' + b[1] + '</p></div></section>';
      } else if (t === 'h2') {
        closeSec(); openSec();
        html += '<h2>' + b[1] + '</h2>';
      } else if (t === 'p') {
        openSec();
        html += '<p>' + b[1] + '</p>';
      } else if (t === 'ul') {
        openSec();
        html += '<ul>';
        for (var j=0;j<b[1].length;j++) html += '<li>' + b[1][j] + '</li>';
        html += '</ul>';
      } else if (t === 'faq') {
        openSec();
        html += '<div class="faq-item"><p class="faq-q">' + b[1] + '</p><p class="faq-a">' + b[2] + '</p></div>';
      } else if (t === 'contact') {
        closeSec();
        html += '<section><div class="contact-card"><span class="label">' + b[1] +
                '</span><a class="email" href="mailto:khatskevich.mv@gmail.com">khatskevich.mv@gmail.com</a><span class="note">' +
                b[2] + '</span></div></section>';
      }
    }
    closeSec();
    return html;
  }

  function apply(loc) {
    var d = STR[loc] || STR['en'];
    var ui = UI[loc] || UI['en'];
    document.documentElement.lang = loc;
    document.title = d.title + ' — Logica Coffee';
    document.getElementById('title').textContent = d.title;
    document.getElementById('updated').textContent = d.updated;
    document.getElementById('langLabel').textContent = '';
    document.getElementById('content').innerHTML = renderBlocks(d.blocks, ui);
    var foot = document.getElementById('footer');
    if (foot) {
      foot.innerHTML = 'Logica Coffee &mdash; Mikita Khatskevich &mdash; 2026' +
        (KIND === 'support' ? ' &mdash; <a href="./index.html">' + ui.footerPrivacy + '</a>' : '');
    }
    document.getElementById('lang').value = loc;
    try { localStorage.setItem('lc_lang', loc); } catch(e){}
  }

  var sel = document.getElementById('lang');
  sel.addEventListener('change', function(){ location.hash = this.value; apply(this.value); });
  window.addEventListener('hashchange', function(){ var h = location.hash.replace('#',''); if (STR[h]) apply(h); });
  apply(pickLang());
</script>
